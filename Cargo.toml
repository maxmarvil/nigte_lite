[package]
authors = ["marvil"]
edition = "2021"
readme = "README.md"
name = "nigte_lite"
version = "0.1.0"

[dependencies]

# this lets you use `cargo fix`!
[[bin]]
name = "nigte_lite"
test = false
bench = false

[profile.dev]
codegen-units = 1 # better optimizations
debug = 1
lto = false # better optimizations

[profile.release]
codegen-units = 1 # better optimizations
debug = 1 # symbols are nice and they don't increase the size on Flash
lto = false # better optimizations
